server:
  port: 8761

spring:
  application:
    name: service-registry

eureka:
  instance:
    hostname: localhost
  client:
    # Le registre ne s'enregistre pas lui-même et ne récupère pas le registre
    register-with-eureka: false
    fetch-registry: false
    service-url:
      defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/
  server:
    # En développement : désactive le mode "self preservation" pour voir disparaître
    # rapidement les instances arrêtées
    enable-self-preservation: false
